n><section class="sec"><div class="w"><div class="kicker">Ways to work together</div><div class="grid"><a class="card" href="/about/"><h3>About Gab</h3><p>From Paris to New York: teaching, international partnerships, performance, DJ work and a pedagogy-led approach to movement.</p><div class="arrow">→</div></a><a class="card" href="/mentorship/"><h3>Mentorship Program</h3><p>Structured long-term development with feedback, private training, guided practice and a progressive curriculum.</p><div class="arrow">→</div></a><a class="card" href="/privates/"><h3>Private + Kinesthetic Training</h3><p>Choose between individualized technical coaching and movement-first kinesthetic practice.</p><div class="arrow">→</div></a><a class="card" href="/classes/"><h3>Classes & Workshops</h3><p>Regular Brazilian Zouk and Lambada training in New York City.</p><div class="arrow">→</div></a><a class="card" href="/brazilian-zouk-classes-nyc/"><h3>Brazilian Zouk NYC</h3><p>Dedicated New York City Brazilian Zouk classes, training and private lessons.</p><div class="arrow">→</div></a><a class="card" href="/lambada-classes-nyc/"><h3>Lambada NYC</h3><p>Structured Lambada classes and private training in New York City.</p><div class="arrow">→</div></a><a class="card" href="/wedding/"><h3>First Dance Forever</h3><p>Wedding-dance preparation that blends elegance, comfort, connection and movement you can actually own.</p><div class="arrow">→</div></a><a class="card" href="/creative/"><h3>DJ & Creative Work</h3><p>Music, performance, modeling and movement-based collaborations.</p><div class="arrow">→</div></a></div></div></section><section class="sec warm"><div class="w"><div class="kicker">Teaching philosophy</div><p class="quote">Teaching is its own discipline. Good dance education should diagnose, organize, sequence and transfer—not merely demonstrate.</p></div></section>`;const ABOUT=`<section class="hero"><div class="w"><span class="tag">About Gab Lacarriere</span><h1>Dance artist. Educator. Movement thinker.</h1><p class="lede">Gab Lacarriere is a Brazilian Zouk and Lambada artist, educator and DJ based in New York City. His work brings together social dance, pedagogy, movement research and creative expression, with one central question: how can dancers understand movement deeply enough to make it their own?</p></div></section><section class="sec"><div class="w"><div class="kicker">Biography</div><div class="bioText"><p class="bioLead">For Gab, technique is not the end goal. It is the structure that makes freedom possible.</p><p>Originally from France, Gab came to dance with an unusual foundation: formal studies in pedagogy and philosophy of science, together with professional experience as a school teacher. That background continues to shape his approach to movement education. Rather than treating teaching as the transmission of steps, he approaches it as a discipline of observation, diagnosis, sequencing, feedback and learning design.</p><p>Gab began teaching Brazilian Zouk in France around 2017–2018. His earliest teaching period included classes in Rennes alongside Marie Robert, before his work expanded to Paris. By 2018, public event records document him teaching Brazilian Zouk in Paris, while he was also becoming active in the social-dance scene as DJ Gab.</p><p>A formative part of those early professional years was his long-running collaboration with Sabrina Beija-Flor. Gab and Sabrina taught Brazilian Zouk together for several years, combining regular classes in Paris with workshops, social events and European appearances. Public records document them teaching together from 2018 and later running a structured weekly program in Paris with separate fundamentals and advanced-development tracks. Their partnership also reflected Gab’s broader involvement in Zouk culture through both teaching and DJing.</p><p>Gab later developed a long-term teaching and performance partnership with Patrycja Jakimczyk. Together they taught regular Brazilian Zouk and Lambada classes in Paris and appeared at workshops, festivals and dance events internationally, with their work connecting Gab to dance communities across Europe.</p><p>In 2023, Gab began collaborating with Danish dancer and educator Caroline Haugsted. They became official dance partners in 2024 and developed <strong>Zouk Art Empowerment</strong>, an approach combining technical clarity with creative exploration, personal expression and embodied connection. Their collaboration included teaching, demonstrations and international work across Europe, Mexico and South America.</p><p>Across these different partnerships and stages of his career, Gab’s teaching became increasingly centered on the architecture of movement: how patterns are built, how they transform, how timing and connection organize them, and how dancers can learn principles that transfer beyond any single combination. His interest shifted progressively from teaching movement vocabulary toward building movement understanding.</p><p>Now based in New York City, Gab teaches Brazilian Zouk and Lambada through weekly classes, workshops, private coaching and long-term mentorship. His current work is built around a pedagogy-led training system designed to move dancers from imitation toward understanding and from understanding toward autonomy. Classes explore pattern architecture, movement transformations, connection, timing, body organization and decision-making. Private and mentorship work follows the same process: identify the real constraint, create a clear model, design deliberate practice and reintegrate the skill into dancing.</p><p>Alongside teaching, Gab continues to work as a DJ, performer, model and movement-based creative artist. Music curation has been part of his involvement in the Zouk community since his early years in France, while performance and visual work form another dimension of his artistic practice.</p><p>Across all of these roles, the underlying project remains the same: to develop dancers who do not merely know more movements, but who perceive more, understand more and have more choices.</p></div></div></section><section class="sec soft"><div class="w"><div class="kicker">Career arc</div><div class="bioTimeline"><div class="bioStep"><b>France · c. 2017–2018</b><div><h3>First teaching years</h3><p class="muted">Early Brazilian Zouk teaching in Rennes alongside Marie Robert, followed by an expanding teaching presence in Paris.</p></div></div><div class="bioStep"><b>Paris + Europe · from 2018</b><div><h3>Gab & Sabrina</h3><p class="muted">Several years teaching Brazilian Zouk with Sabrina Beija-Flor through regular Paris classes, workshops, social events and European appearances, alongside Gab’s developing work as a Zouk DJ.</p></div></div><div class="bioStep"><b>Europe</b><div><h3>Gab & Patrycja</h3><p class="muted">Regular Zouk and Lambada teaching, performances and festival work with Patrycja Jakimczyk across European dance communities.</p></div></div><div class="bioStep"><b>2023–2024 · Europe + Americas</b><div><h3>Gab & Caroline · Zouk Art Empowerment</h3><p class="muted">Collaboration with Caroline Haugsted, including teaching and international work in Europe, Mexico and South America, alongside development of an approach integrating technique, creativity, expression and embodied connection.</p></div></div><div class="bioStep"><b>New York City</b><div><h3>Pedagogy-led movement education</h3><p class="muted">Weekly classes, workshops, private training and mentorship built around movement logic, deliberate practice and dancer autonomy.</p></div></div></div></div></section><section class="sec warm"><div class="w"><div class="kicker">Teaching philosophy</div><p class="quote">Technique creates options. Understanding creates independence. The goal is not to collect patterns, but to understand movement well enough to make choices.</p></div></section><section class="sec"><div class="w"><div class="bioStats"><div class="bioStat"><strong>Zouk + Lambada</strong><span class="muted">Teaching, social dancing, performance and movement research.</span></div><div class="bioStat"><strong>Pedagogy</strong><span class="muted">A teaching practice informed by education, learning design, diagnosis, feedback and deliberate practice.</span></div><div class="bioStat"><strong>International practice</strong><span class="muted">A career developed from Rennes and Paris through international festivals and now New York City.</span></div></div><div class="actions"><a class="btn" href="/mentorship/">Explore Mentorship</a><a class="btn ghost" href="/classes/">Weekly Classes</a></div></div></section>`;const CLASSES=`<section class="hero"><div class="w"><span class="tag">Weekly Classes · NYC</span><h1>Train the logic behind the movement.</h1><p class="lede">Brazilian Zouk on Tuesday and Lambada on Thursday, with clear technical themes and repeatable training goals.</p></div></section><section class="sec"><div class="w"><figure class="classesPhoto"><img src="/classes-teaching.jpeg" alt="Gab Lacarriere teaching a dance class"></figure><div class="g2"><div><div class="kicker">Tuesday · Brazilian Zouk</div><h2>Pattern Combination + Pattern Mastery</h2><div class="schedule"><div class="row"><b>7–8 PM</b><div><strong>Pattern Combination</strong><br><span class="muted">Pattern combinations with clear movement logic.</span></div></div><div class="row"><b>8–9 PM</b><div><strong>Pattern Mastery</strong><br><span class="muted">Structure, transformations, timing, connection and JnJ preparation.</span></div></div></div><p class="muted">Intermediate+ · Playwrights Horizons · Zouk before Solas.</p></div><div><div class="kicker">Thursday · Lambada</div><h2>Lambada Foundation + Architecture</h2><div class="schedule"><div class="row"><b>7–8 PM</b><div><strong>Lambada Foundation</strong><br><span class="muted">Rhythm, body organization, partner communication and movement mechanics.</span></div></div><div class="row"><b>8–9 PM</b><div><strong>Lambada Architecture</strong><br><span class="muted">Structure, pathways, pattern relationships and movement transformations.</span></div></div></div></div></div><div class="actions"><a class="btn" href="https://www.instagram.com/gablacarriere">Check Instagram for current updates</a></div></div></section>`;const ZOUKNYC=`<section class="hero"><div class="w"><span class="tag">Brazilian Zouk Classes · New York City</span><h1>Brazilian Zouk Classes in NYC</h1><p class="lede">Train Brazilian Zouk in New York City with Gab Lacarriere through structured classes focused on movement logic, connection, timing, adaptability and usable social-dance skills.</p><div class="actions"><a class="btn" href="/classes/">See Current Class Schedule</a><a class="btn ghost" href="/privates/">Private Zouk Lessons</a></div></div></section><section class="sec"><div class="w"><div class="g2"><div><div class="kicker">Learn Brazilian Zouk in NYC</div><h2>Understand the movement, not just the pattern.</h2><p class="muted">Gab’s Brazilian Zouk classes are designed for dancers who want more than sequences to memorize. Training develops the principles underneath the dance: connection, body organization, timing, pathways, pattern architecture, transitions and the ability to adapt in real social dancing.</p><p class="muted">Classes are taught in New York City and connect technical understanding with repeatable practice so dancers can build skills that transfer from one pattern to another.</p></div><div class="card"><h3>What you train</h3><ul class="list"><li>Connection and partner communication</li><li>Timing and rhythm</li><li>Pattern combinations and transformations</li><li>Body organization and movement quality</li><li>Social-dance adaptability</li><li>JnJ-oriented decision-making and clarity</li></ul></div></div></div></section><section class="sec soft"><div class="w"><div class="kicker">Brazilian Zouk in New York</div><h2>Who these classes are for</h2><div class="grid"><div class="card"><h3>Improvers</h3><p>Build cleaner foundations and understand why movements work.</p></div><div class="card"><h3>Intermediate dancers</h3><p>Develop combinations, transitions, musical choices and adaptable movement vocabulary.</p></div><div class="card"><h3>Competitors & serious students</h3><p>Train precision, decision-making, connection quality and transferable movement principles.</p></div></div><div class="actions"><a class="btn" href="/classes/">View NYC Classes</a><a class="btn ghost" href="/mentorship/">Explore Mentorship</a></div></div></section><section class="sec"><div class="w"><div class="kicker">Brazilian Zouk NYC FAQ</div><div class="bioText"><h3>Do I need a partner?</h3><p class="muted">No. Partner rotation is a normal part of social-dance training, so you can attend independently.</p><h3>Where are the classes?</h3><p class="muted">Gab teaches regular Brazilian Zouk classes in New York City. Check the current Classes page for the latest venue, day and time.</p><h3>Can I book a private Brazilian Zouk lesson?</h3><p class="muted">Yes. Private training is available for dancers who want individualized work on technique, connection, mechanics, musicality or specific recurring problems.</p></div></div></section>`;const LAMBADANYC=`<section class="hero"><div class="w"><span class="tag">Lambada Classes · New York City</span><h1>Lambada Classes in NYC</h1><p class="lede">Learn Lambada in New York City with Gab Lacarriere through structured training in rhythm, body organization, partner communication, pathways and movement architecture.</p><div class="actions"><a class="btn" href="/classes/">See Current Class Schedule</a><a class="btn ghost" href="/privates/">Private Lambada Lessons</a></div></div></section><section class="sec"><div class="w"><div class="g2"><div><div class="kicker">Learn Lambada in NYC</div><h2>Build foundations that create freedom.</h2><p class="muted">Gab’s Lambada teaching focuses on the structures that allow dancers to move clearly, safely and creatively with a partner. Students train rhythm, body organization, partner communication, movement mechanics, pathways and the relationships between patterns.</p><p class="muted">Rather than treating Lambada as a collection of figures, the training develops a framework dancers can reuse across many situations.</p></div><div class="card"><h3>What you train</h3><ul class="list"><li>Lambada rhythm and timing</li><li>Body organization and mechanics</li><li>Partner communication</li><li>Pathways and pattern relationships</li><li>Movement transformations</li><li>Social-dance adaptability</li></ul></div></div></div></section><section class="sec soft"><div class="w"><div class="kicker">Lambada in New York</div><h2>Structured learning for social dancers.</h2><div class="grid"><div class="card"><h3>Foundations</h3><p>Develop rhythm, mechanics and partner communication that make later material easier.</p></div><div class="card"><h3>Architecture</h3><p>Understand pathways, structures and how patterns relate and transform.</p></div><div class="card"><h3>Individual coaching</h3><p>Use private lessons to address specific movement or connection constraints.</p></div></div><div class="actions"><a class="btn" href="/classes/">View NYC Classes</a><a class="btn ghost" href="/privates/">Book Private Training</a></div></div></section><section class="sec"><div class="w"><div class="kicker">Lambada NYC FAQ</div><div class="bioText"><h3>Do I need a partner?</h3><p class="muted">No. You can attend independently and train through partner rotation.</p><h3>Where are Lambada classes held?</h3><p class="muted">Gab teaches Lambada in New York City. The Classes page contains the current venue and schedule.</p><h3>Can I take private Lambada lessons?</h3><p class="muted">Yes. Private training can focus on rhythm, mechanics, partner communication, pathways or a specific technical challenge.</p></div></div></section>`;const PRIV=`<section class="hero"><div class="w"><span class="tag">Private + Kinesthetic Training · Zouk + Lambada</span><h1>Two ways to train one-on-one.</h1><p class="lede">Choose between a traditional private lesson for diagnosis and technical understanding, or a Kinesthetic Practice Session built around continuous movement, repetition and physical feedback.</p></div></section><section class="sec"><div class="w"><div class="g2"><div class="card"><div class="kicker">Private Lesson</div><h2>Understand what needs to change.</h2><p>Individual coaching around technique, connection, mechanics, musicality and your current constraints. We diagnose recurring issues, clarify the underlying movement principle and build practice that transfers back into your dancing.</p><div class="actions"><a class="btn" href="mailto:riseadance@gmail.com?subject=Private%20Training%20with%20Gab">Book a Private Lesson</a></div></div><div class="card space"><div class="kicker">Kinesthetic Practice Session</div><h2>Less talking. More dancing.</h2><p>A one-on-one Brazilian Zouk or Lambada practice session with minimal explanation and maximum movement. Continuous dancing, repetition and physical feedback build timing, connection, coordination and movement habits directly through guided practice.</p><div class="actions"><a class="btn" href="mailto:riseadance@gmail.com?subject=Kinesthetic%20Practice%20Session%20with%20Gab">Book a Kinesthetic Session</a></div></div></div></div></section><section class="sec soft"><div class="w"><div class="kicker">Private lesson process</div><div class="grid"><div class="card"><h3>Diagnose</h3><p>Find the actual constraint rather than treating every visible symptom.</p></div><div class="card"><h3>Understand</h3><p>Build a usable mental model of timing, tone, posture, axis, connection and pathway.</p></div><div class="card"><h3>Transfer</h3><p>Turn the idea into drills and then reintegrate it into partnered dancing.</p></div></div></div></section>`;const WEDDING=`<section class="hero"><div class="w"><span class="tag">First Dance Forever</span><h1>A first dance that feels like the two of you.</h1><p class="lede">Personalized wedding-dance preparation built around comfort, connection, musicality and movement you can own together—not a routine you are afraid to forget.</p><div class="actions"><a class="btn" href="mailto:riseadance@gmail.com?subject=First%20Dance%20Forever">Plan your first dance</a></div></div></section>`;const CREATIVE=`<section class="hero"><div class="w"><span class="tag">DJ · Performance · Modeling</span><h1>Creative work across movement, music and image.</h1><p class="lede">DJ sets, performance, modeling, event collaborations and movement-based creative projects.</p><div class="actions"><a class="btn" href="mailto:riseadance@gmail.com?subject=Creative%20Collaboration">Contact Gab</a></div></div></section><section class="sec"><div class="w"><div class="grid"><div class="card"><h3>DJ</h3><p>Dance-floor-aware music selection for social dance and events.</p></div><div class="card"><h3>Performance</h3><p>Movement-centered performance and artistic collaboration.</p></div><div class="card"><h3>Modeling & Creative</h3><p>Editorial, event and movement-based creative work.</p></div></div></div></section>`;const MENT=`<section class="hero"><div class="w"><span class="tag">Mentor Ship · Zouk + Lambada · NYC</span><h1>Welcome aboard the Mentor Ship. 🚀</h1><p class="lede">A structured monthly mentorship for dancers who want clearer foundations, stronger movement quality and long-term progression.</p><div class="actions"><a class="btn" href="#apply">Apply</a></div></div></section><section class="sec"><div class="w"><div class="grid"><div class="card space"><div class="price">$200 / month</div><p>Ongoing mentorship designed for continuity rather than isolated lessons.</p></div><div class="card space"><h3>Diagnose</h3><p>Identify the constraint currently limiting your dancing.</p></div><div class="card space"><h3>Train + Integrate</h3><p>Private feedback, kinesthetic practice, solo and partner work, practica, goals and drills.</p></div></div></div></section><section class="sec soft"><div class="w g2"><div><div class="kicker">What the program is for</div><h2>Direction, continuity and transfer.</h2><p class="muted">The mentorship combines individual diagnosis with repeated practice and feedback so concepts have time to become skills.</p><ul class="list"><li>Private training</li><li>Kinesthetic practice</li><li>Solo Zouk + wellness work</li><li>Zouk and Lambada partner fundamentals</li><li>Practica, goals and drill library</li></ul></div><div id="apply"><div class="kicker">Application</div><h2>Apply to the Mentorship Program.</h2><p class="muted">This is a fit application, not automatic enrollment.</p><form class="form" id="f"><div class="field"><label>Name *</label><input name="name" required></div><div class="field"><label>Email *</label><input name="email" type="email" required></div><div class="field"><label>Zouk experience *</label><select name="experience" required><option value="">Choose one</option><option>Less than 6 months</option><option>6–12 months</option><option>1–2 years</option><option>2–4 years</option><option>4+ years</option></select></div><div class="field"><label>Current dance focus *</label><select name="focus" required><option value="">Choose one</option><option>Brazilian Zouk</option><option>Lambada</option><option>Both Zouk and Lambada</option></select></div><div class="field"><label>Main goal *</label><textarea name="goal" required></textarea></div><div class="field"><label>Current challenge *</label><textarea name="challenge" required></textarea></div><div class="field"><label>Why this Mentorship Program? *</label><textarea name="why" required></textarea></div><button class="btn">Submit application</button></form></div></div></section>`;const P={'/':HOME,'/about/':ABOUT,'/classes/':CLASSES,'/brazilian-zouk-classes-nyc/':ZOUKNYC,'/lambada-classes-nyc/':LAMBADANYC,'/privates/':PRIV,'/wedding/':WEDDING,'/creative/':CREATIVE,'/mentorship/':MENT};const SEO={
