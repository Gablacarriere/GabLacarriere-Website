ead><body><nav><div class="w n"><a class="brand" href="/">GAB LACARRIERE</a><div class="links"><a href="/privates/">Privates</a><a href="/classes/">Classes</a><a href="/wedding/">Wedding</a><a href="/creative/">Creative</a><a class="btn" href="/mentorship/">Mentorship</a></div></div></nav><main id="app"></main><footer><div class="w">Gab Lacarriere · Brazilian Zouk · Lambada · Movement Education · New York City</div></footer><script>const HOME=`<section class="hero"><div class="w homeHero"><div><span class="tag">Zouk · Lambada · Movement Education · NYC</span><h1>Movement with structure. Dance with freedom.</h1><p class="lede">Gab Lacarriere is a Brazilian Zouk and Lambada artist, pedagogy teacher, and movement educator. Training is built around understanding movement—not just collecting patterns.</p><div class="actions"><a class="btn" href="/mentorship/">Explore Mentorship</a><a class="btn ghost" href="/classes/">Weekly Classes</a></div></div><figure class="heroPortrait"><img src="/081524OGContact - 653A5417.jpeg" alt="Gab Lacarriere portrait"></figure></div></section><section class="sec"><div class="w"><div class="kicker">Ways to work together</div><div class="grid"><a class="card" href="/mentorship/"><h3>Mentorship Program</h3><p>Structured long-term development with feedback, private training, guided practice and a progressive curriculum.</p><div class="arrow">→</div></a><a class="card" href="/privates/"><h3>Private Training</h3><p>Individual training around technique, connection, mechanics, musicality and your current constraints.</p><div class="arrow">→</div></a><a class="card" href="/classes/"><h3>Classes & Workshops</h3><p>Regular Brazilian Zouk and Lambada training in New York City.</p><div class="arrow">→</div></a><a class="card" href="/wedding/"><h3>First Dance Forever</h3><p>Wedding-dance preparation that blends elegance, comfort, connection and movement you can actually own.</p><div class="arrow">→</div></a><a class="card" href="/creative/"><h3>DJ & Creative Work</h3><p>Music, performance, modeling and movement-based collaborations.</p><div class="arrow">→</div></a></div></div></section><section class="sec warm"><div class="w"><div class="kicker">Teaching philosophy</div><p class="quote">Teaching is its own discipline. Good dance education should diagnose, organize, sequence and transfer—not merely demonstrate.</p></div></section>`;const CLASSES=`<section class="hero"><div class="w"><span class="tag">Weekly Classes · NYC</span><h1>Train the logic behind the movement.</h1><p class="lede">Brazilian Zouk on Tuesday and Lambada on Thursday, with clear technical themes and repeatable training goals.</p></div></section><section class="sec"><div class="w"><div class="g2"><div><div class="kicker">Tuesday · Brazilian Zouk</div><h2>Pattern Combination + Pattern Mastery</h2><div class="schedule"><div class="row"><b>7–8 PM</b><div><strong>Pattern Combination</strong><br><span class="muted">Pattern combinations with clear movement logic.</span></div></div><div class="row"><b>8–9 PM</b><div><strong>Pattern Mastery</strong><br><span class="muted">Structure, transformations, timing, connection and JnJ preparation.</span></div></div></div><p class="muted">Intermediate+ · Playwrights Horizons · Zouk before Solas.</p></div><div><div class="kicker">Thursday · Lambada</div><h2>Lambada Foundation + Architecture</h2><div class="schedule"><div class="row"><b>7–8 PM</b><div><strong>Lambada Foundation</strong><br><span class="muted">Rhythm, body organization, partner communication and movement mechanics.</span></div></div><div class="row"><b>8–9 PM</b><div><strong>Lambada Architecture</strong><br><span class="muted">Structure, pathways, pattern relationships and movement transformations.</span></div></div></div></div></div><div class="actions"><a class="btn" href="https://www.instagram.com/gablacarriere">Check Instagram for current updates</a></div></div></section>`;const PRIV=`<section class="hero"><div class="w"><span class="tag">Private Training · Zouk + Lambada</span><h1>Private training built around what your dancing needs now.</h1><p class="lede">Diagnose recurring issues, clarify movement principles and design practice that transfers back into your dancing.</p><div class="actions"><a class="btn" href="mailto:riseadance@gmail.com?subject=Private%20Training%20with%20Gab">Contact Gab</a></div></div></section><section class="sec"><div class="w"><div class="grid"><div class="card"><h3>Diagnose</h3><p>Find the actual constraint rather than treating every visible symptom.</p></div><div class="card"><h3>Understand</h3><p>Build a usable mental model of timing, tone, posture, axis, connection and pathway.</p></div><div class="card"><h3>Transfer</h3><p>Turn the idea into drills and then reintegrate it into partnered dancing.</p></div></div></div></section>`;const WEDDING=`<section class="hero"><div class="w"><span class="tag">First Dance Forever</span><h1>A first dance that feels like the two of you.</h1><p class="lede">Personalized wedding-dance preparation built around comfort, connection, musicality and movement you can own together—not a routine you are afraid to forget.</p><div class="actions"><a class="btn" href="mailto:riseadance@gmail.com?subject=First%20Dance%20Forever">Plan your first dance</a></div></div></section>`;const CREATIVE=`<section class="hero"><div class="w"><span class="tag">DJ · Performance · Modeling</span><h1>Creative work across movement, music and image.</h1><p class="lede">DJ sets, performance, modeling, event collaborations and movement-based creative projects.</p><div class="actions"><a class="btn" href="mailto:riseadance@gmail.com?subject=Creative%20Collaboration">Contact Gab</a></div></div></section><section class="sec"><div class="w"><div class="grid"><div class="card"><h3>DJ</h3><p>Dance-floor-aware music selection for social dance and events.</p></div><div class="card"><h3>Performance</h3><p>Movement-centered performance and artistic collaboration.</p></div><div class="card"><h3>Modeling & Creative</h3><p>Editorial, event and movement-based creative work.</p></div></div></div></section>`;const MENT=`<section class="hero"><div class="w"><span class="tag">Mentor Ship · Zouk + Lambada · NYC</span><h1>Welcome aboard the Mentor Ship. 🚀</h1><p class="lede">A structured monthly mentorship for dancers who want clearer foundations, stronger movement quality and long-term progression.</p><div class="actions"><a class="btn" href="#apply">Apply</a></div></div></section><section class="sec"><div class="w"><div class="grid"><div class="card space"><div class="price">$200 / month</div><p>Ongoing mentorship designed for continuity rather than isolated lessons.</p></div><div class="card space"><h3>Diagnose</h3><p>Identify the constraint currently limiting your dancing.</p></div><div class="card space"><h3>Train + Integrate</h3><p>Private feedback, kinesthetic practice, solo and partner work, practica, goals and drills.</p></div></div></div></section><section class="sec soft"><div class="w g2"><div><div class="kicker">What the program is for</div><h2>Direction, continuity and transfer.</h2><p class="muted">The mentorship combines individual diagnosis with repeated practice and feedback so concepts have time to become skills.</p><ul class="list"><li>Private training</li><li>Kinesthetic practice</li><li>Unlimited video feedback</li><li>Solo Zouk + wellness work</li><li>Zouk and Lambada partner fundamentals</li><li>Practica, goals and drill library</li></ul></div><div id="apply"><div class="kicker">Application</div><h2>Apply to the Mentorship Program.</h2><p class="muted">This is a fit application, not automatic enrollment.</p><form class="form" id="f"><div class="field"><label>Name *</label><input name="name" required></div><div class="field"><label>Email *</label><input name="email" type="email" required></div><div class="field"><label>Zouk experience *</label><select name="experience" required><option value="">Choose one</option><option>Less than 6
